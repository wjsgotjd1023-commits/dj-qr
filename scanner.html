<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0F18">
<title>장비 QR 스캐너</title>
<style>
  :root{--hl:#7CC4FF;--ok:#3DDC97;--bad:#FF8D7C}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0B0F18;color:#fff;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden}
  video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  .shade{position:fixed;inset:0;pointer-events:none;display:grid;place-items:center}
  .frame{width:min(68vw,300px);aspect-ratio:1;position:relative;box-shadow:0 0 0 100vmax rgba(0,0,0,.45);border-radius:18px}
  .frame i{position:absolute;width:38px;height:38px;border:5px solid var(--hl);transition:border-color .15s}
  .frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:16px 0 0 0}
  .frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 16px 0 0}
  .frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 16px}
  .frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 16px 0}
  .frame.ok i{border-color:var(--ok)} .frame.bad i{border-color:var(--bad)}
  .top{position:fixed;left:0;right:0;top:0;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:linear-gradient(rgba(0,0,0,.65),transparent)}
  .top b{font-size:17px}
  .top small{display:block;font-size:12px;opacity:.75;font-weight:500}
  button,a.btn{border:0;border-radius:999px;padding:10px 16px;font-size:14px;font-weight:700;background:rgba(255,255,255,.16);color:#fff;text-decoration:none;cursor:pointer}
  .bottom{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;justify-items:center;background:linear-gradient(transparent,rgba(0,0,0,.7))}
  .msg{font-size:15px;font-weight:700;text-align:center;min-height:22px;text-shadow:0 1px 3px #000}
  .msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .start{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:#0B0F18}
  .start div{display:grid;gap:14px;max-width:320px}
  .start p{margin:0;line-height:1.6;opacity:.85;font-size:15px}
  .start .go{background:#2B4ACB;font-size:17px;padding:15px 22px;border-radius:14px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<div class="shade"><div class="frame" id="frame"><i></i><i></i><i></i><i></i></div></div>
<div class="top"><div><b>장비 QR 찍기</b><small>네모 안에 스티커 QR을 비추면 자동으로 읽어요</small></div><button id="back" type="button">앱으로</button></div>
<div class="bottom">
  <div class="msg" id="msg">카메라를 켜는 중…</div>
  <div class="row"><button id="torch" type="button" hidden>손전등 켜기</button></div>
</div>
<div class="start" id="start" hidden><div>
  <p id="start-t">카메라를 쓰려면 아래 버튼을 눌러 주세요.</p>
  <button class="go" id="start-b" type="button">카메라 켜기</button>
  <button id="back2" type="button">앱으로 돌아가기</button>
</div></div>

<script>
(function(){
  // 대전 장비 현황 앱이 이 페이지를 열 때 주소 뒤에 ?app=앱주소 를 붙여 줘요.
  // 앱 주소는 구글 Apps Script 웹앱 주소만 받아요 (다른 곳으로 보내지 않게).
  var P=new URLSearchParams(location.search);
  var APP=P.get('app')||'';
  if(!/^https:\/\/script\.google\.com\/(a\/[^/]+\/)?macros\/s\/[A-Za-z0-9_-]+\/(exec|dev)$/.test(APP)) APP='';
  var RE=new RegExp('^[0-9]{2}(0[1-9]|1[0-2])[A-Z]{2,5}[0-9]{2,5}$'); // 장비 스티커 번호 모양 (예: 2404CMO002)
  var $=function(id){return document.getElementById(id);};
  var v=$('v'), stream=null, bd=null, busy=false, sent=false, lastBad='', badAt=0, timer=null;

  function msg(t,cls){ var m=$('msg'); m.textContent=t; m.className='msg'+(cls?' '+cls:''); $('frame').className='frame'+(cls?' '+cls:''); }
  function norm(t){ return String(t||'').trim().toUpperCase().replace(/\s+/g,''); }

  // 찾은 번호를 앱으로 보냄: 앱이 연 창이면 앱에 바로 전달하고 닫기, 아니면 앱 주소로 이동
  function sendToApp(id){
    sent=true; stop();
    try{ if(navigator.vibrate) navigator.vibrate(70); }catch(e){}
    msg(id+' 확인! 앱으로 넘어가요…','ok');
    var op=null; try{ op=window.opener; }catch(e){}
    if(op&&!op.closed){
      try{ op.postMessage({type:'djqr',id:id},'*'); }catch(e){ op=null; }
      if(op){ setTimeout(function(){ window.close(); setTimeout(function(){ go(id); },400); },150); return; }
    }
    go(id);
  }
  function go(id){
    if(!APP){ msg(id+' — 앱 주소를 몰라서 넘어갈 수 없어요. 앱에서 QR 찍기를 눌러 이 화면을 열어 주세요.','bad'); return; }
    location.replace(APP+(id?'?qr='+encodeURIComponent(id):''));
  }
  function back(){
    stop();
    var op=null; try{ op=window.opener; }catch(e){}
    if(op&&!op.closed){ window.close(); setTimeout(function(){ go(''); },300); } else go('');
  }
  $('back').onclick=back; $('back2').onclick=back;

  function seen(text){
    if(sent) return;
    var id=norm(text);
    if(RE.test(id)) return sendToApp(id);
    // 장비 스티커가 아닌 QR은 무시 (안내만 잠깐)
    if(id!==lastBad||Date.now()-badAt>2500){ lastBad=id; badAt=Date.now(); msg('장비 스티커 QR이 아니에요','bad');
      setTimeout(function(){ if(!sent&&Date.now()-badAt>=1900) msg('네모 안에 스티커 QR을 비춰 주세요'); },2000); }
  }

  var canvas=document.createElement('canvas'), ctx=canvas.getContext('2d',{willReadFrequently:true});
  function tick(){
    if(!stream||sent) return;
    if(busy||v.readyState<2||!v.videoWidth){ timer=setTimeout(tick,120); return; }
    busy=true;
    var p;
    if(bd){ p=bd.detect(v).then(function(r){ return r||[]; }).catch(function(){ return []; }).then(function(r){
        for(var i=0;i<r.length;i++) if(RE.test(norm(r[i].rawValue))) return r[i].rawValue;
        return r.length?r[0].rawValue:null; }); }
    else {
      // 화면 가운데 네모 부분만 작게 잘라서 읽음 (빠르게)
      var w=v.videoWidth,h=v.videoHeight,s=Math.min(w,h)*0.75,sx=(w-s)/2,sy=(h-s)/2,o=Math.min(560,Math.round(s));
      canvas.width=o; canvas.height=o; ctx.drawImage(v,sx,sy,s,s,0,0,o,o);
      var r=window.jsQR?window.jsQR(ctx.getImageData(0,0,o,o).data,o,o,{inversionAttempts:'dontInvert'}):null;
      p=Promise.resolve(r&&r.data?r.data:null);
    }
    p.then(function(t){ busy=false; if(t) seen(t); if(!sent) timer=setTimeout(tick,90); });
  }

  function stop(){ clearTimeout(timer); if(stream){ stream.getTracks().forEach(function(t){t.stop();}); stream=null; } }
  function loadJsQR(){ return new Promise(function(res,rej){ if(window.jsQR) return res();
    var s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
  function prepDecoder(){
    if(!('BarcodeDetector' in window)) return loadJsQR();
    return BarcodeDetector.getSupportedFormats().then(function(f){
      if(f.indexOf('qr_code')>=0) bd=new BarcodeDetector({formats:['qr_code']}); else return loadJsQR();
    }).catch(loadJsQR);
  }
  function start(){
    $('start').hidden=true; msg('카메라를 켜는 중…');
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ showStart('이 브라우저에서는 카메라를 쓸 수 없어요. 크롬(안드로이드) 또는 사파리(아이폰)로 열어 주세요.',false); return; }
    var dec=prepDecoder();
    navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}}).then(function(s){
      stream=s; v.srcObject=s; var pp=v.play(); if(pp&&pp.catch) pp.catch(function(){});
      msg('네모 안에 스티커 QR을 비춰 주세요');
      // 손전등 (지원하는 안드로이드 폰만)
      try{ var tr=s.getVideoTracks()[0], cap=tr.getCapabilities?tr.getCapabilities():{}; if(cap.torch){ var on=false; $('torch').hidden=false;
        $('torch').onclick=function(){ on=!on; tr.applyConstraints({advanced:[{torch:on}]}).catch(function(){}); $('torch').textContent=on?'손전등 끄기':'손전등 켜기'; }; } }catch(e){}
      dec.then(tick,function(){ msg('QR 읽는 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.','bad'); });
    }).catch(function(e){
      showStart(e&&e.name==='NotAllowedError'?'카메라 사용이 막혀 있어요. 주소창 옆 설정(자물쇠·aA)에서 카메라를 "허용"으로 바꾼 뒤 다시 눌러 주세요.':'카메라를 켤 수 없어요. 다시 눌러 주세요.',true);
    });
  }
  function showStart(t,canRetry){ $('start-t').textContent=t; $('start-b').hidden=!canRetry; $('start').hidden=false; }
  $('start-b').onclick=start;
  document.addEventListener('visibilitychange',function(){ if(document.hidden) stop(); else if(!sent&&!stream) start(); });
  start();
})();
</script>
</body>
</html>
