<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>장비현황</title>
<meta name="apple-mobile-web-app-title" content="장비현황">
<meta name="application-name" content="장비현황">
<meta name="theme-color" content="#D9580A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#1A1411;color:#fff;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  .wrap{max-width:440px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top,0px)) 22px 32px;display:grid;gap:18px;justify-items:center;text-align:center}
  .ic{width:96px;height:96px;border-radius:22px;box-shadow:0 10px 26px rgba(0,0,0,.35)}
  h1{margin:0;font-size:26px}
  p{margin:0;line-height:1.6;opacity:.85;font-size:15px}
  .go{display:block;width:100%;background:#FF8A3D;color:#1A0E05;border-radius:14px;padding:16px;font-size:18px;font-weight:800;text-decoration:none}
  .card{width:100%;background:#26201C;border-radius:16px;padding:16px 18px;text-align:left;display:grid;gap:8px;font-size:14.5px;line-height:1.55}
  .card b{color:#FFB27A}
  .card ol{margin:0;padding-left:20px}
  .hint{font-size:12.5px;opacity:.6}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="page" hidden>
  <img class="ic" src="icon-192.png" alt="">
  <h1>장비현황</h1>
  <p>대전 장비 현황 앱이에요.<br>아래 방법으로 <b>홈 화면에 추가</b>하면 이 아이콘으로 바로 열 수 있어요.</p>
  <a class="go" id="go" href="#">장비현황 열기</a>
  <div class="card"><b>안드로이드 (크롬)</b><ol><li>오른쪽 위 <b>⋮</b> 메뉴</li><li><b>홈 화면에 추가</b> (또는 '앱 설치')</li><li>이름이 '장비현황'인지 보고 <b>추가</b></li></ol></div>
  <div class="card"><b>아이폰 (사파리)</b><ol><li>아래쪽 <b>공유 버튼(□↑)</b></li><li><b>홈 화면에 추가</b></li><li>이름이 '장비현황'인지 보고 <b>추가</b></li></ol></div>
  <p class="hint">예전에 만든 홈 화면 아이콘은 지우고 이걸로 새로 추가해 주세요.</p>
</div>
<script>
(function(){
  // 장비현황 앱(구글 Apps Script) 주소. 스캐너를 한 번이라도 쓰면 그 주소를 기억해서 우선 써요.
  var APP='https://script.google.com/macros/s/AKfycbzC-Knb6DX8-rER4okNa0n4l_1-umCEiZkLvfPzcdAosQTWe4_MsF4Jkp67frbLXV9H/exec';
  try{ var saved=localStorage.getItem('dj-app'); if(saved&&/^https:\/\/script\.google\.com\//.test(saved)) APP=saved; }catch(e){}
  var q=new URLSearchParams(location.search);
  // 홈 화면 아이콘으로 열었으면 바로 앱으로
  if(q.get('from')==='home'){ location.replace(APP); return; }
  document.getElementById('go').href=APP;
  document.getElementById('page').hidden=false;
  // 아이폰은 '홈 화면에 추가'할 때 지금 주소를 저장해서, 주소 뒤에 ?from=home 을 붙여 둠
  try{ history.replaceState(null,'','./start.html?from=home'); }catch(e){}
})();
</script>
</body>
</html>
