<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0F18">
<title>장비 QR 스캐너</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--hl:#7CC4FF;--ok:#3DDC97;--bad:#FF8D7C}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0B0F18;color:#fff;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden}
  video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  .shade{position:fixed;inset:0;pointer-events:none;display:grid;place-items:center}
  .frame{width:min(68vw,300px);aspect-ratio:1;position:relative;box-shadow:0 0 0 100vmax rgba(0,0,0,.45);border-radius:18px}
  .frame i{position:absolute;width:38px;height:38px;border:5px solid var(--hl);transition:border-color .15s}
  .frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:16px 0 0 0}
  .frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 16px 0 0}
  .frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 16px}
  .frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 16px 0}
  .frame.ok i{border-color:var(--ok)} .frame.bad i{border-color:var(--bad)}
  .top{position:fixed;left:0;right:0;top:0;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:linear-gradient(rgba(0,0,0,.65),transparent)}
  .top b{font-size:17px}
  .top small{display:block;font-size:12px;opacity:.75;font-weight:500}
  button,a.btn{border:0;border-radius:999px;padding:10px 16px;font-size:14px;font-weight:700;background:rgba(255,255,255,.16);color:#fff;text-decoration:none;cursor:pointer}
  .bottom{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;justify-items:center;background:linear-gradient(transparent,rgba(0,0,0,.7))}
  .msg{font-size:15px;font-weight:700;text-align:center;min-height:22px;text-shadow:0 1px 3px #000}
  .msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .start{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:#0B0F18}
  .start div{display:grid;gap:14px;max-width:320px}
  .start p{margin:0;line-height:1.6;opacity:.85;font-size:15px;white-space:pre-line}
  .start .go{background:#2B4ACB;font-size:17px;padding:15px 22px;border-radius:14px}
  [hidden]{display:none!important}
  .multi{width:100%;max-width:460px;display:grid;gap:8px}
  .cnt{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700}
  .cnt b{font-size:22px;color:var(--ok)}
  .ids{display:flex;flex-wrap:wrap;gap:6px;max-height:68px;overflow:hidden}
  .ids span{background:rgba(255,255,255,.16);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;letter-spacing:.02em}
  .ids span.new{background:var(--ok);color:#06150F}
  .done{background:#2B4ACB;font-size:16px;padding:14px;border-radius:14px;width:100%}
  .done:disabled{opacity:.45}
  .flash{position:fixed;inset:0;background:rgba(61,220,151,.28);pointer-events:none;opacity:0;transition:opacity .25s}
  .flash.on{opacity:1;transition:none}
  .hit{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.9);background:rgba(16,120,80,.92);color:#fff;border-radius:22px;padding:18px 26px;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;min-width:220px}
  .hit.on{opacity:1;transform:translate(-50%,-50%) scale(1);transition:none}
  .hit i{display:block;font-style:normal;font-size:46px;line-height:1;font-weight:800}
  .hit b{display:block;font-size:20px;letter-spacing:.03em;margin-top:6px}
  .hit small{display:block;font-size:14px;opacity:.9;margin-top:2px}
  .snd{background:rgba(255,255,255,.16)} .snd.on{background:rgba(61,220,151,.35)}
  .topr{display:flex;gap:6px;flex:none}
  .topr button{white-space:nowrap;padding:8px 12px;font-size:13px}
  .top>div:first-child{min-width:0}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<div class="shade"><div class="frame" id="frame"><i></i><i></i><i></i><i></i></div></div>
<div class="top"><div><b>장비 QR 찍기</b><small>네모 안에 스티커 QR을 비추면 자동으로 읽어요</small></div><div class="topr"><button id="snd" class="snd" type="button">🔇 소리 켜기</button><button id="back" type="button">앱으로</button></div></div>
<div class="flash" id="flash"></div>
<div class="hit" id="hit"><i>✓</i><b id="hit-id"></b><small id="hit-n"></small></div>
<div class="bottom">
  <div class="msg" id="msg">카메라를 켜는 중…</div>
  <div class="multi" id="multi" hidden>
    <div class="cnt"><span>찍은 장비 <b id="cnt">0</b>개</span><button id="undo" type="button" hidden>마지막 것 빼기</button></div>
    <div class="ids" id="ids"></div>
    <button class="done" id="done" type="button" disabled>다 찍었어요 → 옮길 곳 고르기</button>
  </div>
  <div class="row"><button id="torch" type="button" hidden>손전등 켜기</button></div>
</div>
<div class="start" id="start" hidden><div>
  <p id="start-t">카메라를 쓰려면 아래 버튼을 눌러 주세요.</p>
  <button class="go" id="start-b" type="button">카메라 켜기</button>
  <button id="back2" type="button">앱으로 돌아가기</button>
</div></div>

<script>
(function(){
  // 대전 장비 현황 앱이 이 페이지를 열 때 주소 뒤에 ?app=앱주소 를 붙여 줘요.
  // 앱 주소는 구글 Apps Script 웹앱 주소만 받아요 (다른 곳으로 보내지 않게).
  var P=new URLSearchParams(location.search);
  var APP=P.get('app')||'';
  if(!/^https:\/\/script\.google\.com\/(a\/macros\/[^/]+|macros)\/s\/[A-Za-z0-9_-]+\/(exec|dev)$/.test(APP)) APP='';
  if(APP){ try{ localStorage.setItem('dj-app',APP); }catch(e){} } // 홈 화면 아이콘(index.html)이 이 주소를 씀
  var RE=new RegExp('^[0-9]{2}(0[1-9]|1[0-2])[A-Z]{2,5}[0-9]{2,5}$'); // 장비 스티커 번호 모양 (예: 2404CMO002)
  var $=function(id){return document.getElementById(id);};
  // 여러 개 찍기 모드: ?m=1 (찍을 때마다 목록에 쌓고, '다 찍었어요'를 누르면 앱으로)
  var MULTI=P.get('m')==='1', LIST=[];
  String(P.get('have')||'').toUpperCase().split(',').forEach(function(x){ x=x.trim(); if(RE.test(x)&&LIST.indexOf(x)<0&&LIST.length<200) LIST.push(x); });
  var v=$('v'), stream=null, bd=null, busy=false, sent=false, lastBad='', badAt=0, timer=null;

  function msg(t,cls){ var m=$('msg'); m.textContent=t; m.className='msg'+(cls?' '+cls:''); $('frame').className='frame'+(cls?' '+cls:''); }
  function norm(t){ return String(t||'').trim().toUpperCase().replace(/\s+/g,''); }

  // 찾은 번호를 앱으로 보냄: 앱이 연 창이면 앱에 바로 전달하고 닫기, 아니면 앱 주소로 이동
  function sendToApp(id){
    sent=true; stop();
    beep(id,'앱으로 넘어가요…');
    msg(id+' 확인! 앱으로 넘어가요…','ok');
    var op=null; try{ op=window.opener; }catch(e){}
    if(op&&!op.closed){
      try{ op.postMessage({type:'djqr',id:id},'*'); }catch(e){ op=null; }
      if(op){ setTimeout(function(){ window.close(); setTimeout(function(){ go(id); },400); },150); return; }
    }
    setTimeout(function(){ go(id); },450); // 찍힌 표시를 잠깐 보여 준 뒤 앱으로
  }
  function go(id){
    if(!APP){
      if(!id&&history.length>1){ history.back(); return; }
      showStart((id?id+' 를 읽었지만 ':'')+'앱 주소를 몰라서 넘어갈 수 없어요. 장비 현황 앱에서 "QR 찍기 (자동 인식)"을 눌러 이 화면을 열어 주세요.',false); return; }
    location.replace(APP+(id?'?qr='+encodeURIComponent(id):'')+(MULTI?(id?'&':'?')+'m=1':''));
  }
  // ----- 여러 개 찍기 -----
  // ----- 찍혔을 때 알림: 소리 + 진동 + 화면 가운데 큰 표시 -----
  // 핸드폰은 화면을 한 번이라도 눌러야 소리·진동을 허락해요. 그래서 '소리 켜기'를 누르거나 화면을 아무 곳이나 한 번 누르면 켜져요.
  var actx=null, sndOn=false;
  function unlockSound(){
    try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state!=='running') actx.resume(); }catch(e){}
    if(!sndOn){ sndOn=true; $('snd').textContent='🔊 소리 켜짐'; $('snd').className='snd on'; tone(880,0.06,0.15); }
  }
  function tone(f,dur,vol){
    try{ if(!actx||actx.state!=='running') return; var o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime;
      o.type='square'; o.frequency.value=f; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur+0.02); }catch(e){}
  }
  ['pointerdown','touchstart','click'].forEach(function(ev){ document.addEventListener(ev,unlockSound,{passive:true}); });
  var hitT=null;
  function beep(id,sub){
    tone(1400,0.08,0.3); setTimeout(function(){ tone(1900,0.1,0.3); },90);   // 삐빅
    try{ if(navigator.vibrate) navigator.vibrate([70,40,70]); }catch(e){}
    var f=$('flash'); f.className='flash on'; setTimeout(function(){ f.className='flash'; },80);
    if(id){ $('hit-id').textContent=id; $('hit-n').textContent=sub||''; var h=$('hit'); h.className='hit on'; clearTimeout(hitT); hitT=setTimeout(function(){ h.className='hit'; },900); }
  }
  function drawList(newId){
    $('cnt').textContent=LIST.length;
    $('ids').innerHTML=LIST.slice(-8).reverse().map(function(x){ return '<span'+(x===newId?' class="new"':'')+'>'+x+'</span>'; }).join('')+(LIST.length>8?'<span>외 '+(LIST.length-8)+'개</span>':'');
    $('done').disabled=!LIST.length; $('done').textContent=LIST.length?'다 찍었어요 ('+LIST.length+'개) → 옮길 곳 고르기':'스티커 QR을 찍어 주세요';
    $('undo').hidden=!LIST.length;
  }
  var dupAt=0, dupId='';
  function addMulti(id){
    if(LIST.indexOf(id)>=0){ if(id!==dupId||Date.now()-dupAt>2000){ dupId=id; dupAt=Date.now(); msg(id+' 은(는) 이미 찍었어요'); } return; }
    if(LIST.length>=200){ msg('한 번에 200개까지 찍을 수 있어요','bad'); return; }
    LIST.push(id); beep(id, LIST.length+'개째 찍었어요'); drawList(id); msg(id+' 추가! 다음 QR을 비춰 주세요','ok');
    setTimeout(function(){ if(!sent) $('frame').className='frame'; },500);
  }
  if(MULTI){
    $('multi').hidden=false; drawList();
    document.querySelector('.top b').textContent='여러 개 찍기';
    document.querySelector('.top small').textContent='QR을 하나씩 비추면 목록에 쌓여요';
    $('done').onclick=function(){ if(!LIST.length) return; sent=true; stop(); msg(LIST.length+'개를 앱으로 보내는 중…','ok'); go(LIST.join(',')); };
    $('undo').onclick=function(){ var x=LIST.pop(); drawList(); msg(x+' 을(를) 뺐어요'); };
  }
  function back(){
    stop(); $('back2').textContent='돌아가는 중…';
    if(MULTI){ go(LIST.join(',')); return; } // 여러 개 모드: 찍어 둔 목록은 그대로 들고 돌아감
    var op=null; try{ op=window.opener; }catch(e){}
    if(op&&!op.closed){ window.close(); setTimeout(function(){ go(''); },300); } else go('');
  }
  $('back').onclick=back; $('back2').onclick=back;

  function seen(text){
    if(sent) return;
    var id=norm(text);
    if(RE.test(id)) return MULTI?addMulti(id):sendToApp(id);
    // 장비 스티커가 아닌 QR은 무시 (안내만 잠깐)
    if(id!==lastBad||Date.now()-badAt>2500){ lastBad=id; badAt=Date.now(); msg('장비 스티커 QR이 아니에요','bad');
      setTimeout(function(){ if(!sent&&Date.now()-badAt>=1900) msg('네모 안에 스티커 QR을 비춰 주세요'); },2000); }
  }

  var canvas=document.createElement('canvas'), ctx=canvas.getContext('2d',{willReadFrequently:true});
  function tick(){
    if(!stream||sent) return;
    if(busy||v.readyState<2||!v.videoWidth){ timer=setTimeout(tick,120); return; }
    busy=true;
    var p;
    if(bd){ p=bd.detect(v).then(function(r){ return r||[]; }).catch(function(){ return []; }).then(function(r){
        for(var i=0;i<r.length;i++) if(RE.test(norm(r[i].rawValue))) return r[i].rawValue;
        return r.length?r[0].rawValue:null; }); }
    else {
      // 화면 가운데 네모 부분만 작게 잘라서 읽음 (빠르게)
      var w=v.videoWidth,h=v.videoHeight,s=Math.min(w,h)*0.75,sx=(w-s)/2,sy=(h-s)/2,o=Math.min(560,Math.round(s));
      canvas.width=o; canvas.height=o; ctx.drawImage(v,sx,sy,s,s,0,0,o,o);
      var r=window.jsQR?window.jsQR(ctx.getImageData(0,0,o,o).data,o,o,{inversionAttempts:'dontInvert'}):null;
      p=Promise.resolve(r&&r.data?r.data:null);
    }
    p.then(function(t){ busy=false; if(t) seen(t); if(!sent) timer=setTimeout(tick,90); });
  }

  function stop(){ clearTimeout(timer); if(stream){ stream.getTracks().forEach(function(t){t.stop();}); stream=null; } }
  function loadJsQR(){ return new Promise(function(res,rej){ if(window.jsQR) return res();
    var s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
  function prepDecoder(){
    if(!('BarcodeDetector' in window)) return loadJsQR();
    return BarcodeDetector.getSupportedFormats().then(function(f){
      if(f.indexOf('qr_code')>=0) bd=new BarcodeDetector({formats:['qr_code']}); else return loadJsQR();
    }).catch(loadJsQR);
  }
  function start(){
    $('start').hidden=true; msg('카메라를 켜는 중…');
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ showStart('이 브라우저에서는 카메라를 쓸 수 없어요. 크롬(안드로이드) 또는 사파리(아이폰)로 열어 주세요.',false); return; }
    var dec=prepDecoder();
    navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}}).then(function(s){
      stream=s; v.srcObject=s; var pp=v.play(); if(pp&&pp.catch) pp.catch(function(){});
      msg('네모 안에 스티커 QR을 비춰 주세요');
      // 손전등 (지원하는 안드로이드 폰만)
      try{ var tr=s.getVideoTracks()[0], cap=tr.getCapabilities?tr.getCapabilities():{}; if(cap.torch){ var on=false; $('torch').hidden=false;
        $('torch').onclick=function(){ on=!on; tr.applyConstraints({advanced:[{torch:on}]}).catch(function(){}); $('torch').textContent=on?'손전등 끄기':'손전등 켜기'; }; } }catch(e){}
      dec.then(tick,function(){ msg('QR 읽는 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.','bad'); });
    }).catch(function(e){
      var n=(e&&e.name)||'오류', ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
      var how=ios?'아이폰: 설정 앱 → Safari → 카메라 → "허용" (또는 주소창의 aA → 웹 사이트 설정 → 카메라 → 허용)':
                  '안드로이드 크롬: 주소창 왼쪽 아이콘 → 권한(사이트 설정) → 카메라 → "허용"';
      if(n==='NotAllowedError'||n==='SecurityError') showStart('카메라 사용이 막혀 있어요.\n'+how+'\n바꾼 뒤 "카메라 켜기"를 눌러 주세요.',true,n);
      else if(n==='NotFoundError'||n==='OverconstrainedError') showStart('카메라를 찾지 못했어요. 핸드폰에서 열어 주세요.',true,n);
      else if(n==='NotReadableError') showStart('다른 앱이 카메라를 쓰고 있어요. 카메라 앱을 닫고 다시 눌러 주세요.',true,n);
      else showStart('카메라를 켤 수 없어요. 다시 눌러 주세요.',true,n);
    });
  }
  function showStart(t,canRetry,code){ $('start-t').textContent=t+(code?'\n(이유: '+code+')':''); $('start-b').hidden=!canRetry; $('start').hidden=false; }
  // 카카오톡·네이버·인스타 등 앱 안의 브라우저는 카메라를 막는 경우가 많음
  var inApp=/KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\//i.test(navigator.userAgent);
  $('start-b').onclick=function(){ $('start-t').textContent='카메라를 켜는 중…'; start(); };
  document.addEventListener('visibilitychange',function(){ if(document.hidden) stop(); else if(!sent&&!stream) start(); });
  if(inApp) showStart('지금은 카카오톡·네이버 같은 앱 안의 브라우저로 열려 있어서 카메라를 쓸 수 없을 수 있어요.\n오른쪽 위 메뉴(⋮ 또는 공유)에서 "다른 브라우저로 열기"(크롬·사파리)를 눌러 주세요.',true);
  else start();
})();
</script>
</body>
</html>
